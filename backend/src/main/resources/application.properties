spring.application.name=aurelia-smartfood

# ── PostgreSQL ──────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/aurelia_smart_food
spring.datasource.username=aurelia_user
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=SmartFoodAureliaSecretKey2024XYZ!@#$%^&*()_+ABCDEFabcdef123456
app.jwt.expiration=86400000

# ── CORS (frontend React sur port 5173) ─────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# ── SpringDoc / Swagger UI ───────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
